name: Build Mac bootstrap app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-app:
    name: Mac app (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Package and sign Mac app
        env:
          SUPERSURFER_ARCH: arm64
        run: npm run package:mac
      - name: Verify bundled and ZIP-extracted app
        env:
          SUPERSURFER_ARCH: arm64
        run: node tests/mac-package.electron.cjs
      - name: Upload verified app archive
        uses: actions/upload-artifact@v4
        with:
          name: SuperSurfer-mac-arm64
          path: dist/SuperSurfer-*-mac-arm64.zip
          if-no-files-found: error
          retention-days: 14
